<section class="vp-pose-selector">

    <div class="vp-pose-selector__grid">

        <!-- POSE 01 — NEUTRAL -->
        <button
            class="vp-pose-card is-active"
            type="button"
            data-pose="neutral"
            aria-label="Neutral Display"
        >
            <img
                src="../../assets/images/poses/pose-neutral.jpg"
                alt=""
                loading="lazy"
            >
        </button>


        <!-- POSE 02 — HAND ON WAIST -->
        <button
            class="vp-pose-card"
            type="button"
            data-pose="waist"
            aria-label="Hand on Waist"
        >
            <img
                src="../../assets/images/poses/pose-waist.jpg"
                alt=""
                loading="lazy"
            >
        </button>


        <!-- POSE 03 — SIDE DISPLAY -->
        <button
            class="vp-pose-card"
            type="button"
            data-pose="side"
            aria-label="Side Display"
        >
            <img
                src="../../assets/images/poses/pose-side.jpg"
                alt=""
                loading="lazy"
            >
        </button>


        <!-- POSE 04 — PALLU PRESENTATION -->
        <button
            class="vp-pose-card"
            type="button"
            data-pose="pallu"
            aria-label="Pallu Presentation"
        >
            <img
                src="../../assets/images/poses/pose-pallu.jpg"
                alt=""
                loading="lazy"
            >
        </button>


        <!-- POSE 05 — ELEGANT WALKING -->
        <button
            class="vp-pose-card"
            type="button"
            data-pose="walking"
            aria-label="Elegant Walking"
        >
            <img
                src="../../assets/images/poses/pose-walking.jpg"
                alt=""
                loading="lazy"
            >
        </button>

    </div>

</section>
