<section class="vp-product-details">

    <div class="vp-product-details__layout">


        <!-- =====================================
             PRODUCT MEDIA
             ===================================== -->

        <div class="vp-product-details__media">


            <!-- MAIN IMAGE -->

            <div class="vp-product-details__image-wrapper">

                <img
                    class="vp-product-details__image"
                    src="https://images.pexels.com/photos/32244572/pexels-photo-32244572.jpeg?auto=compress&cs=tinysrgb&w=1200"
                    alt="Elegant Silk Saree"
                >


                <button
                    class="vp-product-details__favorite"
                    type="button"
                    aria-label="Add product to favorites"
                    aria-pressed="false"
                >
                    ♡
                </button>

            </div>


            <!-- =================================
                 IMAGE THUMBNAILS
                 ================================= -->

            <div class="vp-product-details__thumbnails">


                <button
                    class="vp-product-details__thumbnail is-active"
                    type="button"
                    aria-label="View product image 1"
                >

                    <img
                        src="https://images.pexels.com/photos/32244572/pexels-photo-32244572.jpeg?auto=compress&cs=tinysrgb&w=400"
                        alt=""
                    >

                </button>


                <button
                    class="vp-product-details__thumbnail"
                    type="button"
                    aria-label="View product image 2"
                >

                    <img
                        src="https://images.pexels.com/photos/32244572/pexels-photo-32244572.jpeg?auto=compress&cs=tinysrgb&w=400"
                        alt=""
                    >

                </button>


                <button
                    class="vp-product-details__thumbnail"
                    type="button"
                    aria-label="View product image 3"
                >

                    <img
                        src="https://images.pexels.com/photos/32244572/pexels-photo-32244572.jpeg?auto=compress&cs=tinysrgb&w=400"
                        alt=""
                    >

                </button>


                <button
                    class="vp-product-details__thumbnail"
                    type="button"
                    aria-label="View product image 4"
                >

                    <img
                        src="https://images.pexels.com/photos/32244572/pexels-photo-32244572.jpeg?auto=compress&cs=tinysrgb&w=400"
                        alt=""
                    >

                </button>


            </div>


        </div>


        <!-- =====================================
             PRODUCT INFORMATION
             ===================================== -->

        <div class="vp-product-details__info">


            <p class="vp-product-details__label">
                VP SAREES
            </p>


            <h1 class="vp-product-details__name">
                Elegant Silk Saree
            </h1>


            <!-- PRICE -->

            <div class="vp-product-details__pricing">

                <span class="vp-product-details__price">
                    ₹2,499
                </span>

                <span class="vp-product-details__old-price">
                    ₹3,499
                </span>

                <span class="vp-product-details__discount">
                    29% OFF
                </span>

            </div>


            <!-- DESCRIPTION -->

            <div class="vp-product-details__section">

                <h2>
                    Description
                </h2>

                <p>
                    An elegant traditional saree designed
                    for a timeless and graceful look.
                    Perfect for festive occasions,
                    celebrations and special moments.
                </p>

            </div>


            <!-- PRODUCT DETAILS -->

            <div class="vp-product-details__section">

                <h2>
                    Product Details
                </h2>


                <div class="vp-product-details__specs">

                    <div class="vp-product-details__spec">

                        <span>
                            Fabric
                        </span>

                        <strong>
                            Silk
                        </strong>

                    </div>


                    <div class="vp-product-details__spec">

                        <span>
                            Color
                        </span>

                        <strong>
                            Red
                        </strong>

                    </div>


                    <div class="vp-product-details__spec">

                        <span>
                            Pattern
                        </span>

                        <strong>
                            Traditional
                        </strong>

                    </div>

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="vp-product-details__actions">

                <button
                    class="vp-product-details__cart"
                    type="button"
                >
                    Add to Cart
                </button>


                <button
                    class="vp-product-details__buy"
                    type="button"
                >
                    Buy Now
                </button>

            </div>


        </div>

    </div>

</section>
