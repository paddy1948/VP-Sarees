<div class="vp-product-gallery">

    <!-- =====================================
         FULLSCREEN VIEWER
         ===================================== -->

    <div
        class="vp-gallery-lightbox"
        aria-hidden="true"
    >

        <button
            class="vp-gallery-lightbox__close"
            type="button"
            aria-label="Close image viewer"
        >
            ×
        </button>


        <button
            class="vp-gallery-lightbox__previous"
            type="button"
            aria-label="Previous image"
        >
            ‹
        </button>


        <div class="vp-gallery-lightbox__content">

            <img
                class="vp-gallery-lightbox__image"
                src=""
                alt=""
            >

        </div>


        <button
            class="vp-gallery-lightbox__next"
            type="button"
            aria-label="Next image"
        >
            ›
        </button>


        <div
            class="vp-gallery-lightbox__counter"
            aria-live="polite"
        >
            1 / 4
        </div>

    </div>

</div>
